# Settings shared by both ways this project can be analysed:
#   - SonarCloud Automatic Analysis reads this file directly.
#   - The Gradle scanner does NOT read it, so build.gradle's sonar { } block loads it.
# Anything only one of them can act on (project identity, build outputs, coverage report
# paths) lives in build.gradle instead.

sonar.sources=src/main
sonar.tests=src/test

# org.avarion.yaml.v1.YamlWrapperImpl and its v2 twin are identical on purpose. Each
# version source set compiles against its own SnakeYAML major release, and the only real
# API difference between the two lives in ToStringRepresenter. Sharing the wrapper would
# force the common source set to compile against one pinned SnakeYAML and run against the
# other, trading a compile-time guarantee for a runtime assumption to save 18 lines.
sonar.cpd.exclusions=**/YamlWrapperImpl.java
